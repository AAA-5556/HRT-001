<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تیکت‌ها و پشتیبانی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container tickets-container">
        <header class="page-header">
            <h2>📩 مرکز تیکت و پیام</h2>
            <button id="back-btn" class="back-btn">بازگشت</button>
        </header>

        <div class="tickets-layout">
            <!-- لیست تیکت‌ها -->
            <div class="tickets-sidebar">
                <button id="new-ticket-btn" class="new-ticket-btn">+ تیکت جدید</button>
                <div id="ticket-list" class="ticket-list">
                    <!-- تیکت‌ها اینجا لود می‌شوند -->
                </div>
            </div>

            <!-- محتوای تیکت -->
            <div class="ticket-content">
                <div id="messages-box" class="messages-box">
                    <p class="empty-state">یک تیکت را برای مشاهده پیام‌ها انتخاب کنید.</p>
                </div>
                <div id="input-area" class="message-input-area" style="display:none;">
                    <textarea id="msg-input" placeholder="پیام خود را بنویسید..."></textarea>
                    <button id="send-msg-btn">ارسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تیکت جدید -->
    <div id="new-ticket-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3>ساخت تیکت جدید</h3>
            <form id="new-ticket-form">
                <div class="form-group"><label>نام کاربری مقصد</label><input type="text" id="target-username" required></div>
                <div class="form-group"><label>موضوع</label><input type="text" id="ticket-subject" required></div>
                <div class="form-group"><label>متن پیام اول</label><textarea id="first-message" rows="4" required></textarea></div>
                <div class="modal-actions"><button type="submit">ارسال تیکت</button><button type="button" class="cancel-btn">انصراف</button></div>
            </form>
            <p id="new-ticket-status" class="error-message"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="impersonation.js"></script>
    <script src="tickets.js"></script>
</body>
</html>
