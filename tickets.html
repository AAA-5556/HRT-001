<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تیکت‌ها و پشتیبانی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container tickets-container">
        <header class="page-header">
            <h2>📩 مرکز تیکت و پیام</h2>
            <button id="back-btn" class="back-btn">بازگشت</button>
        </header>

        <div class="tab-buttons" style="margin-bottom: 10px;">
            <button class="tab-button active" id="tab-open">تیکت‌های باز</button>
            <button class="tab-button" id="tab-closed">تیکت‌های بسته</button>
        </div>

        <div class="tickets-layout">
            <!-- لیست تیکت‌ها -->
            <div class="tickets-sidebar">
                <button id="new-ticket-btn" class="new-ticket-btn">+ تیکت جدید</button>
                <div id="ticket-list" class="ticket-list">
                    <!-- تیکت‌ها اینجا لود می‌شوند -->
                </div>
            </div>

            <!-- محتوای تیکت -->
            <div class="ticket-content">
                <div id="ticket-info-header" style="display:none; padding: 10px; background: #f9f9f9; border-bottom: 1px solid #ddd; justify-content: space-between; align-items: center;">
                    <h3 id="active-ticket-subject" style="margin:0;"></h3>
                    <div>
                        <button id="toggle-status-btn" style="padding: 5px 10px; border-radius: 4px; cursor: pointer;"></button>
                    </div>
                </div>
                <div id="messages-box" class="messages-box">
                    <p class="empty-state">یک تیکت را برای مشاهده پیام‌ها انتخاب کنید.</p>
                </div>
                <div id="input-area" class="message-input-area" style="display:none;">
                    <textarea id="msg-input" placeholder="پیام خود را بنویسید..."></textarea>
                    <button id="send-msg-btn">ارسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تیکت جدید -->
    <div id="new-ticket-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width: 600px;">
            <h3>ساخت تیکت جدید</h3>
            <div style="display: flex; gap: 20px;">
                <form id="new-ticket-form" style="flex: 2;">
                    <div class="form-group">
                        <label>نام کاربری مقصد</label>
                        <input type="text" id="target-username" required>
                    </div>
                    <div class="form-group"><label>موضوع</label><input type="text" id="ticket-subject" required></div>
                    <div class="form-group"><label>متن پیام اول</label><textarea id="first-message" rows="4" required></textarea></div>
                    <div class="modal-actions"><button type="submit">ارسال تیکت</button><button type="button" class="cancel-btn">انصراف</button></div>
                </form>
                <div id="address-book-side" style="flex: 1; border-right: 1px solid #eee; padding-right: 15px;">
                    <h4>دفترچه مخاطبین</h4>
                    <div id="contacts-list" style="max-height: 300px; overflow-y: auto; font-size: 13px;">
                        <p>در حال بارگذاری...</p>
                    </div>
                </div>
            </div>
            <p id="new-ticket-status" class="error-message"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="impersonation.js"></script>
    <script src="tickets.js"></script>
</body>
</html>
