<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات سیستم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h2>تنظیمات سیستم</h2>
            <a href="#" class="back-link">بازگشت</a>
        </header>

        <div class="settings-form">
            <div class="form-group-check">
                <input type="checkbox" id="allowMemberManagement">
                <label for="allowMemberManagement">اجازه مدیریت اعضا توسط موسسات</label>
            </div>
            <div class="form-group-check">
                <input type="checkbox" id="allowUsernameChange">
                <label for="allowUsernameChange">اجازه تغییر نام کاربری به زیرمجموعه‌ها</label>
            </div>
            <div class="form-group-check">
                <input type="checkbox" id="allowPasswordChange">
                <label for="allowPasswordChange">اجازه تغییر رمز عبور به زیرمجموعه‌ها</label>
            </div>

            <br>
            <button id="save-settings-btn" class="save-btn">ذخیره تنظیمات</button>
            <p id="settings-status"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="impersonation.js"></script>
    <script src="settings.js"></script>
</body>
</html>
