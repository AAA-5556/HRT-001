<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت اعضا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h2 id="manage-page-title">مدیریت اعضا</h2>
            <a href="#" class="back-link">بازگشت</a>
        </header>

        <section class="add-section">
            <h3>افزودن اعضای جدید (دسته جمعی)</h3>
            <p style="font-size: 0.9em; color: #666;">هر مورد را در یک خط جدید وارد کنید. ترتیب خطوط در هر سه جعبه باید یکسان باشد.</p>
            <form id="add-members-form">
                <div class="multi-input-row">
                    <div class="form-group"><label>نام و نام خانوادگی</label><textarea id="names-textarea" rows="5" placeholder="نام اول&#10;نام دوم..." required></textarea></div>
                    <div class="form-group"><label>کد ملی (اختیاری)</label><textarea id="ids-textarea" rows="5" placeholder="کد ملی اول&#10;کد ملی دوم..."></textarea></div>
                    <div class="form-group"><label>موبایل (اختیاری)</label><textarea id="mobiles-textarea" rows="5" placeholder="موبایل اول&#10;موبایل دوم..."></textarea></div>
                </div>
                <button type="submit" class="save-btn">افزودن همه اعضا</button>
                <p id="add-status-message"></p>
            </form>
        </section>

        <hr class="section-divider">

        <div class="tab-buttons">
            <button class="tab-button active" onclick="showTab('active')">اعضای فعال</button>
            <button class="tab-button" onclick="showTab('inactive')">غیرفعال / بایگانی</button>
        </div>

        <div id="active-tab" class="tab-content active">
            <table id="active-members-table">
                <thead><tr><th>ID</th><th>نام</th><th>کد ملی</th><th>موبایل</th><th>عملیات</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="inactive-tab" class="tab-content">
            <table id="inactive-members-table">
                <thead><tr><th>ID</th><th>نام</th><th>کد ملی</th><th>موبایل</th><th>عملیات</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="impersonation.js"></script>
    <script src="manage-members.js"></script>
    <script>
        function showTab(type) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(type === 'active') {
                document.querySelector('.tab-button:nth-child(1)').classList.add('active');
                document.getElementById('active-tab').classList.add('active');
            } else {
                document.querySelector('.tab-button:nth-child(2)').classList.add('active');
                document.getElementById('inactive-tab').classList.add('active');
            }
        }
    </script>
</body>
</html>
