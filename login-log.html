<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاریخچه ورود</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header class="page-header">
            <h2>تاریخچه ورود کاربران</h2>
            <a href="#" class="back-link">بازگشت</a>

        <div class="controls">

        <p id="loading-log">در حال بارگذاری...</p>
        <table>
            <thead><tr><th>تاریخ و زمان</th><th>نام کاربری</th><th>نقش</th><th>وضعیت</th></tr></thead>
            <tbody id="log-table-body"></tbody>
        </table>
        <div id="pagination-container" class="pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="impersonation.js"></script>
    <script src="login-log.js"></script>

</html>
