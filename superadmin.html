<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل سوپرادمین</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="header-title-menu">
                <h2 id="superadmin-title">پنل Superadmin</h2>
                <!-- منوی کشویی مخصوص سوپرادمین -->
                <div class="main-menu-container">
                    <button id="main-menu-button" class="card-menu-button">⋮</button>
                    <div id="main-menu-dropdown" class="card-menu-dropdown">
                        <a href="archive.html">📂 بایگانی ادمین‌ها</a>
                        <a href="settings.html">⚙️ تنظیمات</a>
                        <hr style="margin: 5px 0;">
                        <a href="login-log.html">📅 تاریخچه ورودها</a>
                        <a href="action-log.html">📝 تاریخچه تغییرات</a>
                        <hr style="margin: 5px 0;">
                        <button id="broadcast-notif-btn" style="width:100%; border:none; background:none; text-align:right; padding:10px; cursor:pointer; font-family:inherit;">📢 ارسال اعلان همگانی</button>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button id="logout-button">خروج</button>
            </div>
        </header>

        <div class="table-header">
            <h3>مدیریت کاربران Admin</h3>
            <button id="add-admin-button" class="add-button">+ افزودن Admin</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>نام کاربری</th>
                    <th>تاریخ ایجاد</th>
                    <th>زیرمجموعه</th>
                    <th>اقدامات</th>
                </tr>
            </thead>
            <tbody id="admin-list-body"></tbody>
        </table>
    </div>

    <div id="broadcast-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3>📢 ارسال اعلان برای زیرمجموعه‌ها</h3>
            <form id="broadcast-form">
                <div class="form-group"><label>عنوان اعلان</label><input type="text" id="notif-title" required></div>
                <div class="form-group"><label>متن پیام</label><textarea id="notif-message" rows="4" required></textarea></div>
                <div class="modal-actions"><button type="submit">ارسال</button><button type="button" class="cancel-btn">انصراف</button></div>
            </form>
            <p id="broadcast-status" class="error-message"></p>
        </div>
    </div>

    <!-- مودال‌ها -->
    <div id="add-user-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>افزودن Admin جدید</h3>
            <form id="add-user-form">
                <div class="form-group"><label>نام کاربری</label><input type="text" id="new-username" required></div>
                <div class="form-group"><label>رمز عبور</label><input type="password" id="new-password" required></div>
                <div class="modal-actions"><button type="submit">ایجاد</button><button type="button" class="cancel-btn">انصراف</button></div>
            </form>
            <p id="add-user-status" class="error-message"></p>
        </div>
    </div>
    
    <div id="edit-user-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="edit-modal-title">ویرایش</h3>
            <form id="edit-user-form">
                <input type="hidden" id="edit-user-id">
                <div class="form-group"><label>رمز عبور جدید</label><input type="password" id="edit-password"></div>
                <div class="modal-actions"><button type="submit">ذخیره</button><button type="button" class="cancel-btn">انصراف</button></div>
            </form>
        </div>
    </div>

    <!-- اسکریپت‌ها -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="impersonation.js"></script>
    <script src="superadmin.js"></script>
</body>
</html>
